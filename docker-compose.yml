services:
  mongo:
    image: mongo:6.0
    container_name: uniconnect-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - uniconnect-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uniconnect-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/uniconnect
      CLIENT_URL: http://localhost
      JWT_SECRET: dev_jwt_secret_key_minimum_32_characters_long_for_security_123456
      REFRESH_SECRET: dev_refresh_jwt_secret_key_minimum_32_characters_123456
      SESSION_SECRET: dev_session_secret_key_1234567890_abcdef
      ANONYMOUS_KEY_HEX: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - uniconnect-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uniconnect-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - uniconnect-network

volumes:
  mongo_data:
    driver: local

networks:
  uniconnect-network:
    driver: bridge
