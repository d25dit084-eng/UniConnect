# Render Blueprint Spec — UniConnect Backend Deployment
# https://render.com/docs/blueprint-spec
#
# NOTE: The React frontend is deployed separately on Vercel.
# This file only configures the Node.js backend on Render.

services:

  # ── Backend Web Service (Node.js + Express + Socket.IO) ──────────────────────
  - type: web
    name: uniconnect-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start

    envVars:
      # ── Server ───────────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production

      # PORT is injected automatically by Render; no need to set it manually.

      # ── MongoDB Atlas ────────────────────────────────────────────────────────
      # Set this in the Render dashboard — NEVER commit the actual value.
      # Format: mongodb+srv://USER:PASS@cluster.mongodb.net/uniconnect?retryWrites=true&w=majority
      # IMPORTANT: URL-encode any special characters in the password
      #   @ → %40  |  # → %23  |  ! → %21  |  $ → %24  |  : → %3A
      - key: MONGO_URI
        sync: false

      # ── JWT Secrets ──────────────────────────────────────────────────────────
      # Render auto-generates secure random values for these.
      - key: JWT_SECRET
        generateValue: true

      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: JWT_EXPIRE
        value: 15m

      - key: JWT_REFRESH_EXPIRE
        value: 7d

      # ── CORS ─────────────────────────────────────────────────────────────────
      # Set to your actual Vercel production URL — NEVER commit the actual value.
      # Example: https://uniconnect-abc123.vercel.app
      - key: CLIENT_URL
        sync: false

      # ── Email / SMTP (optional — for password reset emails) ──────────────────
      # If not set, reset tokens are logged to the Render console instead.
      - key: EMAIL_HOST
        sync: false

      - key: EMAIL_PORT
        value: 587

      - key: EMAIL_USER
        sync: false

      - key: EMAIL_PASS
        sync: false

      - key: EMAIL_FROM
        value: noreply@uniconnect.dev

      # ── Cloudinary (optional — for cloud image uploads) ──────────────────────
      # Leave unset to use local disk uploads (not persistent on Render free tier).
      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false
