# Render Blueprint Spec — UniConnect Deployment
# https://render.com/docs/blueprint-spec

services:

  # ── Backend Web Service (Node.js + WebSockets) ──────────────────────────
  - type: web
    name: uniconnect-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 10000

      - key: MONGO_URI
        sync: false

      - key: JWT_SECRET
        generateValue: true

      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: JWT_EXPIRE
        value: 15m

      - key: JWT_REFRESH_EXPIRE
        value: 7d

      - key: CLIENT_URL
        sync: false


  # ── Frontend Static Site (Vite React SPA) ───────────────────────────────
  - type: web
    name: uniconnect-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_URL
        sync: false

      - key: VITE_SOCKET_URL
        sync: false
