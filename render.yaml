# Render Blueprint Configuration for UniConnect
# Deploy Backend (Node.js + Express + Socket.IO) and Frontend (Vite Static Site)
# https://render.com/docs/blueprint-spec

services:
  # ── Backend Web Service (Node.js + WebSockets) ────────────────────────────
  - type: web
    name: uniconnect-backend
    env: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false # User enters MongoDB Atlas URI in Render dashboard
      - key: JWT_SECRET
        generateValue: true # Render automatically generates a 32-char secure secret
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 15m
      - key: JWT_REFRESH_EXPIRE
        value: 7d
      - key: CLIENT_URL
        fromService:
          type: web
          name: uniconnect-frontend
          property: url

  # ── Frontend Static Site (Vite React SPA) ──────────────────────────────────
  - type: web
    name: uniconnect-frontend
    env: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: uniconnect-backend
          property: url
          append: /api
      - key: VITE_SOCKET_URL
        fromService:
          type: web
          name: uniconnect-backend
          property: url
