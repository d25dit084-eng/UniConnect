# Render Blueprint Spec — UniConnect Deployment (Backend Only)
# https://render.com/docs/blueprint-spec

services:
  # ── Backend Web Service (Node.js + WebSockets) ──────────────────────────
  - type: web
    name: uniconnect-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production

      - key: MONGO_URI
        sync: false # Entered manually in Render dashboard

      - key: JWT_SECRET
        generateValue: true # Render auto-generates secure 32-char secret

      - key: JWT_REFRESH_SECRET
        generateValue: true # Render auto-generates secure 32-char secret

      - key: JWT_EXPIRE
        value: 15m

      - key: JWT_REFRESH_EXPIRE
        value: 7d

      - key: CLIENT_URL
        sync: false # Set to Vercel frontend URL in Render dashboard

      # ── Cloudinary (Optional Image Uploads) ───────────────────────────────
      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false

      # ── Email SMTP (Optional Verification/Password Reset) ─────────────────
      - key: EMAIL_HOST
        sync: false

      - key: EMAIL_PORT
        sync: false

      - key: EMAIL_USER
        sync: false

      - key: EMAIL_PASS
        sync: false

      - key: EMAIL_FROM
        sync: false
