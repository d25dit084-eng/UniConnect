# Render Blueprint Spec — UniConnect Deployment
# https://render.com/docs/blueprint-spec

services:
  # ── Backend Web Service (Node.js + WebSockets) ────────────────────────────
  - type: web
    name: uniconnect-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false # Set manually in Render Dashboard (SECRET)
      - key: JWT_SECRET
        generateValue: true # Render auto-generates a secure 32-char secret
      - key: JWT_REFRESH_SECRET
        generateValue: true # Render auto-generates a secure 32-char secret
      - key: JWT_EXPIRE
        value: 15m
      - key: JWT_REFRESH_EXPIRE
        value: 7d
      - key: CLIENT_URL
        sync: false # Set to frontend Render URL in Render Dashboard

  # ── Frontend Static Site (Vite React SPA) ──────────────────────────────────
  - type: web
    name: uniconnect-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Set to https://<backend-render-url>/api in Render Dashboard
      - key: VITE_SOCKET_URL
        sync: false # Set to https://<backend-render-url> in Render Dashboard
